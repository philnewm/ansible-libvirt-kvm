---

- name: Define default storage pool
  become: "{{ libvirt_kvm_as_root }}"
  loop: "{{ vm.disks }}"
  loop_control:
    loop_var: vdisk
    label: "{{ vdisk.pool }}"
  community.libvirt.virt_pool:
    name: default
    state: present
    xml: |
      <pool type="dir">
        <name>{{ vdisk.pool }}</name>
        <target>
          <path>/var/lib/libvirt/images</path>
        </target>
      </pool>

- name: Ensure default storage pool is active
  become: "{{ libvirt_kvm_as_root }}"
  loop: "{{ vm.disks }}"
  loop_control:
    loop_var: vdisk
    label: "{{ vdisk.pool }}"
  community.libvirt.virt_pool:
    name: "{{ vdisk.pool }}"
    state: active
    autostart: true

# required as `cloud_init` expects content rather than a file path
- name: Prepare cloud-init data
  when: vm.cloud_init is defined
  block:
    - name: Read cloud-init user-data
      when: vm.cloud_init is defined
      ansible.builtin.slurp:
        src: "{{ vm.cloud_init.user_data_file }}"
      register: libvirt_kvm_cloud_init_user_data

    - name: Build cloud-init configuration
      when: vm.cloud_init is defined
      ansible.builtin.set_fact:
        libvirt_kvm_cloud_init:
          user_data: "{{ libvirt_kvm_cloud_init_user_data.content | b64decode }}"
          meta_data: |
            instance-id: {{ vm.name | lower }}
            local-hostname: {{ vm.provisioning.hostname }}

- name: Configure vm
  become: "{{ libvirt_kvm_as_root }}"
  community.libvirt.virt_install:
    name: "{{ vm.name }}"
    uri: "{{ vm.uri | default('qemu:///system') }}"
    state: present
    autostart: "{{ vm.autostart | default(false) }}"
    memory: "{{ vm.memory | default(2048) }}"
    vcpus: "{{ vm.vcpus | default(2) }}"
    machine: "{{ vm.machine | default('q35') }}"
    osinfo: "{{ vm.osinfo }}"
    disks: "{{ vm.disks }}"
    location: "{{ vm.location | default(omit) }}"
    location_opts: "{{ vm.location_opts | default(omit) }}"
    networks: "{{ vm.networks | default(omit) }}"
    pxe: "{{ vm.pxe | default(omit) }}"
    boot: "{{ vm.boot | default(omit) }}"
    boot_opts: "{{ vm.boot_opts | default(omit) }}"
    graphics: "{{ vm.graphics | default(omit) }}"
    video: "{{ vm.video | default(omit) }}"
    initrd_inject: "{{ vm.initrd_inject | default(omit) }}"
    cloud_init: "{{ libvirt_kvm_cloud_init | default(omit) }}"
    extra_args: "{{ vm.extra_args | default(omit) }}"
    # For unattended installs which reboot afterwards
    wait_timeout: "{{ vm.wait_timeout | default(1800) }}"
  async: 2100
  poll: 0
  register: libvirt_kvm_install_job

- name: Remember VM installation job
  ansible.builtin.set_fact:
    libvirt_kvm_install_jobs: >-
      {{
        libvirt_kvm_install_jobs | default([])
        + [{
            'name': vm.name,
            'jid': libvirt_kvm_install_job.ansible_job_id
          }]
      }}

...
