---

- name: Define default storage pool
  become: "{{ libvirt_kvm_as_root }}"
  loop: "{{ vm.disks }}"
  loop_control:
    loop_var: vdisk
    label: "{{ vdisk.pool }}"
  community.libvirt.virt_pool:
    name: default
    state: present
    xml: |
      <pool type="dir">
        <name>{{ vdisk.pool }}</name>
        <target>
          <path>/var/lib/libvirt/images</path>
        </target>
      </pool>

- name: Ensure default storage pool is active
  become: "{{ libvirt_kvm_as_root }}"
  loop: "{{ vm.disks }}"
  loop_control:
    loop_var: vdisk
    label: "{{ vdisk.pool }}"
  community.libvirt.virt_pool:
    name: "{{ vdisk.pool }}"
    state: active
    autostart: true

- name: Configure vm
  become: "{{ libvirt_kvm_as_root }}"
  community.libvirt.virt_install:
    name: "{{ vm.name }}"
    uri: "{{ vm.uri | default('qemu:///system') }}"
    state: present
    autostart: "{{ vm.autostart | default(false) }}"
    memory: "{{ vm.memory | default(2048) }}"
    vcpus: "{{ vm.vcpus | default(2) }}"
    machine: "{{ vm.machine | default('q35') }}"
    osinfo: "{{ vm.osinfo }}"
    disks: "{{ vm.disks }}"
    location: "{{ vm.location | default(omit) }}"
    location_opts: "{{ vm.location_opts | default(omit) }}"
    networks: "{{ vm.networks | default(omit) }}"
    pxe: "{{ vm.pxe | default(omit) }}"
    boot: "{{ vm.boot | default(omit) }}"
    boot_opts: "{{ vm.boot_opts | default(omit) }}"
    graphics: "{{ vm.graphics | default(omit) }}"
    video: "{{ vm.video | default(omit) }}"
    initrd_inject: "{{ vm.initrd_inject | default(omit) }}"
    extra_args: "{{ vm.extra_args | default(omit) }}"
    # For unattended installs which reboot afterwards
    wait_timeout: "{{ vm.wait_timeout | default(1800) }}"

- name: Start vm
  become: "{{ libvirt_kvm_as_root }}"
  community.libvirt.virt:
    name: "{{ vm.name }}"
    uri: "{{ vm.uri | default('qemu:///system') }}"
    state: "{{ vm.state | default('running') }}"

...
